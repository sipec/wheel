<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/flavicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="quantum random universe splitter decision maker" />
  <title>SPIN THE WHEEL</title>
 </head>
 <body>
  <div id="offline-banner" style="display:none; position:fixed; top:0; left:0; right:0; background:var(--secondary); color:white; text-align:center; padding:8px; z-index:1000;">
   OFFLINE MODE - manually choosing universe
  </div>

  <main style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; position:relative;">
   <div style="font-size: 3rem; font-size:3rem; color:var(--white); font-weight:bold; margin-bottom:2rem; text-align: center; min-height: 40px;">
    <div id="spin-text" style="cursor:pointer; user-select:none; text-align:center; transition:all 0.3s ease;">
     SPIN THE WHEEL
    </div>

    <div id="result-text"></div>
   </div>

   <div id="wheel-container" style="position:relative; width:300px; height:300px; margin:2rem 0;">
    <div id="wheel" style="width:100%; height:100%; border-radius:50%; background:conic-gradient(from 0deg, var(--primary) 0deg 60deg, var(--secondary) 60deg 120deg, var(--primary) 120deg 180deg, var(--secondary) 180deg 240deg, var(--primary) 240deg 300deg, var(--secondary) 300deg 360deg); cursor:grab; transition:transform 0.1s ease-out; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; box-shadow:0 8px 32px rgba(0,0,0,0.3);">
     <div style="background:white; border-radius:50%; width:60px; height:60px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.2);">
      ✨
     </div>
    </div>
    <div id="wheel-pointer" style="position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-bottom:30px solid var(--black); z-index:10;"></div>
   </div>

   <div id="bottom-buttons" style="position:fixed; bottom:2rem; left:2rem; width:100%; display:flex; gap:1rem; justify-items:space-between;">
    <a id="help-btn" href="/about.html" style="width:60px; height:60px; border-radius:50%; background:var(--primary); border:none; font-size:1.5rem; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.2); transition:all 0.3s ease; display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--black); foht-weight:bold;">
     ?
    </a>
   </div>
  </main>

  <script type="module" src="/src/main.js"></script>
 </body>
</html>
